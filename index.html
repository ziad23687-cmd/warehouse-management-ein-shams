<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخزن عين شمس - نظام إدارة المخزن</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated Grid Background */
        .grid-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(255, 107, 53, .05) 25%, rgba(255, 107, 53, .05) 26%, transparent 27%, transparent 74%, rgba(255, 107, 53, .05) 75%, rgba(255, 107, 53, .05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(255, 107, 53, .05) 25%, rgba(255, 107, 53, .05) 26%, transparent 27%, transparent 74%, rgba(255, 107, 53, .05) 75%, rgba(255, 107, 53, .05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        /* Floating Nodes */
        .node {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #ff6b35 0%, #ff6b35 60%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.6);
            animation: float 8s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            50% { transform: translateY(-30px) translateX(15px); opacity: 0.8; }
        }

        /* Connecting Lines */
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        line {
            stroke: rgba(255, 107, 53, 0.2);
            stroke-width: 1;
        }

        .line-animated {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: lineDraw 3s ease-in-out infinite;
        }

        @keyframes lineDraw {
            0% { stroke-dashoffset: 1000; }
            50% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -1000; }
        }

        /* Login Container */
        .login-container {
            position: relative;
            z-index: 10;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 50px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 107, 53, 0.2);
            box-shadow: 
                0 0 60px rgba(255, 107, 53, 0.3),
                inset 0 0 30px rgba(255, 107, 53, 0.1),
                0 20px 60px rgba(0, 0, 0, 0.5);
            animation: containerFloat 4s ease-in-out infinite;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        @keyframes containerFloat {
            0%, 100% { transform: translateY(0) translateZ(0); }
            50% { transform: translateY(-20px) translateZ(50px); }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
            perspective: 1000px;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            position: relative;
            transform-style: preserve-3d;
        }

        .logo-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            box-shadow: 
                0 10px 40px rgba(255, 107, 53, 0.4),
                0 0 20px rgba(255, 107, 53, 0.2),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            animation: rotateLogo 6s linear infinite;
            border: 2px solid rgba(255, 107, 53, 0.3);
        }

        @keyframes rotateLogo {
            0% { transform: rotateX(0) rotateY(0); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }

        .logo-section h1 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.4);
        }

        .logo-section p {
            color: rgba(255, 107, 53, 0.8);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 25px;
            animation: slideIn 0.6s ease-out backwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(255, 107, 53, 0.3);
            border-radius: 10px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            transition: all 0.3s ease;
            font-family: inherit;
            backdrop-filter: blur(10px);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        input:focus {
            outline: none;
            border-color: #ff6b35;
            background: rgba(255, 107, 53, 0.1);
            box-shadow: 
                0 0 20px rgba(255, 107, 53, 0.3),
                inset 0 0 10px rgba(255, 107, 53, 0.1);
            transform: translateZ(50px);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 15px 40px rgba(255, 107, 53, 0.5),
                0 0 30px rgba(255, 107, 53, 0.3);
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        .error-message {
            color: #ff4757;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
            animation: shake 0.5s;
            background: rgba(255, 71, 87, 0.1);
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid #ff4757;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .show-error {
            display: block !important;
        }

        @media (max-width: 600px) {
            .login-container {
                padding: 30px;
                max-width: 90%;
            }

            .logo-section h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Grid Background -->
    <div class="grid-background"></div>

    <!-- SVG for connecting lines -->
    <svg id="connectionSvg" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;"></svg>

    <!-- Floating Nodes -->
    <div class="node" style="top: 10%; left: 10%; animation-delay: 0s;"></div>
    <div class="node" style="top: 20%; right: 15%; animation-delay: 1s;"></div>
    <div class="node" style="bottom: 20%; left: 15%; animation-delay: 2s;"></div>
    <div class="node" style="bottom: 15%; right: 10%; animation-delay: 3s;"></div>
    <div class="node" style="top: 50%; left: 5%; animation-delay: 1.5s;"></div>
    <div class="node" style="top: 30%; right: 5%; animation-delay: 2.5s;"></div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="logo-section">
            <div class="logo">
                <div class="logo-inner">📦</div>
            </div>
            <h1>مخزن عين شمس</h1>
            <p>نظام إدارة المخزن المتقدم</p>
        </div>

        <form id="loginForm">
            <div class="form-group" style="animation-delay: 0.1s;">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
            </div>

            <div class="form-group" style="animation-delay: 0.2s;">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
            </div>

            <button type="submit" class="login-btn">دخول النظام</button>
            <div class="error-message" id="errorMsg">❌ بيانات غير صحيحة!</div>
        </form>
    </div>

    <script>
        // Generate animated connecting lines
        function drawConnections() {
            const svg = document.getElementById('connectionSvg');
            const nodes = document.querySelectorAll('.node');
            
            // Clear previous lines
            svg.innerHTML = '';
            
            // Draw lines between random nodes
            if (nodes.length >= 2) {
                for (let i = 0; i < nodes.length - 1; i++) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    const node1 = nodes[i];
                    const node2 = nodes[i + 1];
                    
                    const x1 = parseFloat(node1.style.left) * window.innerWidth / 100;
                    const y1 = parseFloat(node1.style.top) * window.innerHeight / 100;
                    const x2 = parseFloat(node2.style.left) * window.innerWidth / 100;
                    const y2 = parseFloat(node2.style.top) * window.innerHeight / 100;
                    
                    line.setAttribute('x1', x1);
                    line.setAttribute('y1', y1);
                    line.setAttribute('x2', x2);
                    line.setAttribute('y2', y2);
                    line.setAttribute('class', 'line-animated');
                    
                    svg.appendChild(line);
                }
            }
        }

        drawConnections();
        window.addEventListener('resize', drawConnections);

        // Login Handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            // Credentials
            const validUsername = 'ziad.com';
            const validPassword = '01101144082Zizo#';

            if (username === validUsername && password === validPassword) {
                errorMsg.classList.remove('show-error');
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', username);
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.classList.add('show-error');
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>
</html>
